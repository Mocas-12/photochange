name: CI

on:
  push:
    branches: [main]
  pull_request:

# 最小权限默认：除 deploy 显式提权外，所有 job 只读仓库内容
permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Lighthouse 质量门禁：性能数值指标 + 可访问性/最佳实践/SEO 分类
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lighthouse

  # 部署门禁：仅在测试与 Lighthouse 均通过后上线（Pages 源已切到 GitHub Actions）
  deploy:
    needs: [smoke, lighthouse]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # job 级 permissions 是整体替换：checkout 需要 contents: read，须在此一并保留
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # 只打包站点运行所需文件：tests/scripts/收款码等仓库资产不进公网
      - name: Stage site assets
        run: |
          mkdir -p _site
          cp -r index.html style.css main.js info-badge.js page-switch.js pointer-fx.js \
                js fonts icons vendor logo.svg og-image.png manifest.webmanifest service-worker.js \
                _site/
          # 站点引用完整性自检：HTML 里的本地引用必须都存在于 _site
          node -e '
            const fs = require("fs");
            const html = fs.readFileSync("_site/index.html", "utf8");
            const refs = [...html.matchAll(/(?:src|href)="\.\/([^"?]+)/g)].map((m) => m[1]);
            const missing = refs.filter((r) => !fs.existsSync("_site/" + r));
            if (missing.length) { console.error("缺少站点资源: " + missing.join(", ")); process.exit(1); }
          '
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

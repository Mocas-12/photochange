<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PhotoChange</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <link rel="stylesheet" href="./style.css?v=2" />
    <script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
  </head>
  <body>
    <canvas id="fx-canvas" aria-hidden="true"></canvas>
    <div id="pageTrack" class="page-track">
    <section class="hero" id="top">
      <div class="hero-beacon"></div>
      <h1 class="hero-title">PhotoChange</h1>
      <p class="hero-sub">上传 · 裁剪 · 调整 · 转换</p>
      <div class="hero-meta">
        <img src="https://github.com/Mocas-12.png" class="github-avatar" alt="Avatar" />
        <span>Unlimited Box</span>
        <span class="sep">·</span>
        <span>a18577y@gmail.com</span>
        <span class="sep">·</span>
        <span class="busuanzi-container">
          <span id="busuanzi_container_site_pv">访问 <span id="busuanzi_value_site_pv"></span></span>
          <span class="sep" id="busuanzi_sep" style="display:none">|</span>
          <span id="busuanzi_container_site_uv">访客 <span id="busuanzi_value_site_uv"></span></span>
        </span>
      </div>
      <button class="scroll-hint" aria-label="向下滑动" onclick="goToPage(1)">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg>
      </button>
    </section>
    <section id="app">
    <header class="app-header">
      <button id="brandHome" class="back-home" title="返回首页"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>返回主页</button>
      <div class="subtitle">上传 · 裁剪 · 调整 · 转换</div>
    </header>
    <main class="app-main">
      <section class="left">
        <div id="dropzone" class="dropzone">
          <input id="fileInput" type="file" accept="image/*" />
          <div class="dz-inner">
            <svg class="dz-icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-4.5-4.5L7 20"/></svg>
            <div class="dz-copy">
              <div class="dz-title">拖拽图片到此处或点击选择</div>
              <div class="dz-hint">支持 PNG / JPG / JPEG / WebP / BMP</div>
            </div>
            <button id="chooseBtn" class="btn primary">选择图片</button>
          </div>
        </div>
        <div class="display-main-container">
          <div id="image-tools" class="image-tools-fixed">
            <button onclick="changeZoom(-0.1)" title="缩小"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/><path d="M8 11h6"/></svg></button>
            <span class="zoom-text" id="zoom-text">100%</span>
            <button onclick="changeZoom(0.1)" title="放大"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/><path d="M8 11h6M11 8v6"/></svg></button>
            <div class="v-line"></div>
            <button onclick="rotateImage(-90)" title="逆时针旋转"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button>
            <button onclick="rotateImage(90)" title="顺时针旋转"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg></button>
            <div class="v-line"></div>
            <button id="gridBtn" onclick="toggleGrid()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>标尺</button>
          </div>
          <!-- 编辑工具条：裁剪/尺寸/水印/撤销/重置 -->
          <div class="edit-toolbar">
            <button id="toolCrop" class="etool" title="裁剪"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></svg>裁剪</button>
            <button id="toolSize" class="etool" title="尺寸与预设"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3 9 15"/><path d="M12 3H3v18h18v-9"/><path d="M16 3h5v5"/></svg>尺寸</button>
            <button id="toolWm" class="etool" title="文字水印"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/></svg>水印</button>
            <div class="v-line"></div>
            <button id="toolUndo" class="etool" disabled title="撤销 (Ctrl+Z)"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>撤销</button>
            <button id="toolReset" class="etool" title="重置为原图"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 1 9 9c-2.52 0-4.93-1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg>重置</button>
          </div>
          <!-- 操作条：裁剪 -->
          <div id="stripCrop" class="opstrip hidden">
            <label>长宽比</label>
            <select id="stripAspect">
              <option value="free">自由</option>
              <option value="1:1">1:1</option>
              <option value="4:3">4:3</option>
              <option value="16:9">16:9</option>
              <option value="3:2">3:2</option>
            </select>
            <span class="op-tip">在画布上拖出选区</span>
            <button id="cropApply" class="btn primary">应用裁剪</button>
          </div>
          <!-- 操作条：尺寸 -->
          <div id="stripSize" class="opstrip hidden">
            <select id="presetSelect"><option value="0">常用预设…</option></select>
            <input id="widthInput" class="dimension-input" type="number" min="1" step="1" placeholder="宽" />
            <span class="op-x">×</span>
            <input id="heightInput" class="dimension-input" type="number" min="1" step="1" placeholder="高" />
            <label class="switch"><input id="lockRatio" type="checkbox" checked /><span>锁比例</span></label>
            <button id="applyResize" class="btn primary">应用</button>
          </div>
          <!-- 操作条：水印 -->
          <div id="stripWm" class="opstrip hidden">
            <label class="switch"><input id="wmEnable" type="checkbox" /><span>启用</span></label>
            <input id="wmText" type="text" placeholder="水印文字…" style="max-width:180px" />
            <select id="wmPos">
              <option value="tl">左上</option><option value="tm">中上</option><option value="tr">右上</option>
              <option value="ml">居左</option><option value="mm">正中</option><option value="mr">居右</option>
              <option value="bl">左下</option><option value="bm">中下</option><option value="br">右下</option>
            </select>
            <label class="op-label">透明度</label>
            <input id="wmOpacity" type="range" min="0.1" max="1" step="0.05" value="0.5" style="max-width:90px" />
          </div>
          <div class="canvas-wrap grid-on">
            <canvas id="canvas"></canvas>
            <div class="canvas-hint">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-4.5-4.5L7 20"/></svg>
              <p>画布空空如也</p>
              <span>上传一张图片开始编辑</span>
            </div>
            <div id="infoBadge" class="badge hidden">未加载</div>
          </div>
        </div>
      </section>
      <!-- 底部导出条 -->
      <section class="export-bar">
        <div class="eb-group">
          <label for="formatSelect">格式</label>
          <select id="formatSelect">
            <option value="png">PNG</option>
            <option value="jpg">JPG</option>
            <option value="webp">WebP</option>
            <option value="pdf">PDF</option>
          </select>
        </div>
        <div class="eb-group jpg-only hidden" id="jpgOnlyRow">
          <label for="qualityRange">质量</label>
          <input id="qualityRange" type="range" min="0.1" max="1" step="0.05" value="0.92" />
          <span id="qualityValue">0.92</span>
        </div>
        <div class="eb-group">
          <label for="targetKB">压到</label>
          <input id="targetKB" type="number" min="10" step="10" placeholder="不限" style="width:70px" />
          <span class="eb-unit">KB</span>
        </div>
        <div class="eb-group grow">
          <input id="fileName" type="text" placeholder="文件名" />
        </div>
        <div class="eb-download">
          <button id="downloadBtn" class="btn primary wide">导出下载</button>
          <div id="quotaBar" class="quota-bar"><div class="quota-bar-inner" id="quotaBarInner"></div></div>
          <div id="quotaText" class="quota-text"></div>
          <div id="quotaHint" class="quota-hint hidden">提示：这是最后一次免费额度，建议立即激活专业版以防中断</div>
        </div>
      </section>
    </main>
    </section>
    </div>
    <!-- 固定定位的弹层必须放在 .page-track 之外：
         .page-track 带有 transform，会成为 position:fixed 后代的包含块，
         弹窗若放在轨道内会跟随轨道位移，在第二页时被移出视口 -->
    <div id="custom-alert" class="alert-overlay">
      <div class="alert-content">
        <p id="alert-message">请先上传并转换一张图片</p>
        <button onclick="closeAlert()" class="alert-btn">确认</button>
      </div>
    </div>
    <div id="proModal" class="modal-overlay">
      <div class="modal">
        <button id="closeX" class="modal-close-btn" onclick="closeProModal()">×</button>
        <div id="activation-form">
          <h3>额度已用尽</h3>
          <p>您已达到免费下载额度。请开通专业版以解锁无限下载次数！</p>
          <div class="row">
            <input id="activateInput" class="dimension-input" type="text" placeholder="输入激活码" />
          </div>
          <div class="actions">
            <button id="activateBtn" class="btn primary">激活</button>
            <button id="closeModal" class="btn ghost" onclick="closeProModal()">稍后再说</button>
          </div>
          <div class="activation-footer">
            <button class="get-code-btn" onclick="window.open('https://mbd.pub/o/bread/mbd-YZWblJ9paA==','_blank')">还没有激活码？点击获取</button>
          </div>
        </div>
        <!-- activation-modal removed per new purchase flow -->
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <script src="./expose.js"></script>
    <script src="./main.js"></script>
    <script src="./overlay-fix.js"></script>
    <script>
      (function(){
        function showAlert(msg){
          var m=document.getElementById('alert-message');
          var ov=document.getElementById('custom-alert');
          if(m) m.innerText=String(msg);
          if(ov) ov.style.display='flex';
        }
        function closeAlert(){
          var ov=document.getElementById('custom-alert');
          if(ov) ov.style.display='none';
        }
        window.showAlert=showAlert;
        window.closeAlert=closeAlert;
        window.alert=function(msg){showAlert(msg)};
      })();
    </script>
    <script src="./quota.js?v=2"></script>
    <script src="./pointer-fx.js"></script>
    <script src="./page-switch.js?v=6"></script>
    <script src="./info-badge.js"></script>
    <script>
      (function(){
        var tools=document.getElementById('image-tools');
        var canvas=document.getElementById('canvas');
        var zoomText=document.getElementById('zoom-text');
        var gridBtn=document.getElementById('gridBtn');
        if(!tools||!canvas||!zoomText) return;
        var __zoom=1, __angle=0;
        function applyTransform(){
          canvas.style.setProperty('--zoom-level', String(__zoom));
          canvas.style.setProperty('--rotation-angle', __angle + 'deg');
          zoomText.textContent = Math.round(__zoom*100) + '%';
        }
        function clamp(v,min,max){return Math.max(min,Math.min(max,v))}
        window.changeZoom=function(delta){__zoom=clamp(__zoom+delta,0.2,4);applyTransform()};
        window.rotateImage=function(deg){__angle=(__angle+deg)%360;window.currentRotation=__angle;applyTransform()};
        window.toggleGrid=function(){
          var wrap=canvas.parentElement;
          var on=wrap.classList.toggle('grid-on');
          if(gridBtn){gridBtn.classList.toggle('active',on)}
        };
        applyTransform();
        (function(){
          try{
            var on=canvas.parentElement.classList.contains('grid-on');
            if(gridBtn){gridBtn.classList.toggle('active',on)}
          }catch(_){}
        })();
        function showTools(){tools.style.display='flex';document.body.classList.add('has-image')}
        function hideTools(){tools.style.display='none'}
        var fileInput=document.getElementById('fileInput');
        var dropzone=document.getElementById('dropzone');
        var resetBtn=document.getElementById('toolReset');
        if(fileInput){fileInput.addEventListener('change',function(){showTools()})}
        if(dropzone){dropzone.addEventListener('drop',function(){showTools()})}
        if(resetBtn){resetBtn.addEventListener('click',function(){hideTools()})}
        if(window.ResizeObserver){
          var ro=new ResizeObserver(function(entries){
            if(entries&&entries[0]&&entries[0].contentRect){
              var cr=entries[0].contentRect;
              if(cr.width>0&&cr.height>0){showTools()}
            }
          });
          ro.observe(canvas);
        }
      })();
    </script>
    <script>
      /* Ctrl+Z 撤销 */
      document.addEventListener('keydown',function(e){
        if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){
          var tag=e.target&&e.target.tagName;
          if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT')return;
          var btn=document.getElementById('toolUndo');
          if(btn&&!btn.disabled)btn.click();
        }
      });
    </script>
    <script>
      (function(){
        function visible(el){if(!el)return false;const s=getComputedStyle(el);return s.display!=='none'&&s.visibility!=='hidden'}
        function ensureVisible(){
          const pvC=document.getElementById('busuanzi_container_site_pv');
          const uvC=document.getElementById('busuanzi_container_site_uv');
          const pvV=document.getElementById('busuanzi_value_site_pv');
          const uvV=document.getElementById('busuanzi_value_site_uv');
          if(pvC){pvC.style.display='inline'}
          if(uvC){uvC.style.display='inline'}
          if(pvV&&(!pvV.textContent||pvV.textContent.trim()==='')){pvV.textContent='加载中...'}
          if(uvV&&(!uvV.textContent||uvV.textContent.trim()==='')){uvV.textContent='加载中...'}
        }
        function finalizeFallback(){
          const pvV=document.getElementById('busuanzi_value_site_pv');
          const uvV=document.getElementById('busuanzi_value_site_uv');
          if(pvV&&pvV.textContent==='加载中...'){pvV.textContent='暂不可用'}
          if(uvV&&uvV.textContent==='加载中...'){uvV.textContent='暂不可用'}
        }
        function updateSep(){
          const pv=document.getElementById('busuanzi_container_site_pv');
          const uv=document.getElementById('busuanzi_container_site_uv');
          const sep=document.getElementById('busuanzi_sep');
          if(!sep)return;
          sep.style.display = (visible(pv)&&visible(uv)) ? 'inline' : 'none';
        }
        const pv=document.getElementById('busuanzi_container_site_pv');
        const uv=document.getElementById('busuanzi_container_site_uv');
        const obsCfg={attributes:true,attributeFilter:['style','class']};
        if(pv){new MutationObserver(function(){ensureVisible();updateSep()}).observe(pv,obsCfg)}
        if(uv){new MutationObserver(function(){ensureVisible();updateSep()}).observe(uv,obsCfg)}
        document.addEventListener('DOMContentLoaded',function(){ensureVisible();updateSep()});
        window.addEventListener('load',function(){ensureVisible();updateSep()});
        setTimeout(function(){ensureVisible();updateSep()},1200);
        setTimeout(finalizeFallback,5000);
      })();
    </script>
  </body>
  </html>
